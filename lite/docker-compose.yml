services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # nginx (web) forwards exactly one X-Forwarded-For entry: the real visitor.
      TRUST_PROXY: "1"
      NODE_ENV: "production"
      PORT: "8080"
      # The root filesystem is read-only; Chromium writes its profile and caches under HOME/XDG dirs.
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
    env_file:
      - .env
    mem_limit: 1500m
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
      - /app/artifacts
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    depends_on:
      - backend
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
